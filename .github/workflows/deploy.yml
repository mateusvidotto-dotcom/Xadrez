name: Build and publish Chess Coach

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'src/**'
      - 'scripts/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chess-coach-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and Stockfish
        run: npm install

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build for the GitHub Pages project path
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: Normalize the Vite output and publish to the Pages root
        run: |
          cp dist/site-template.html dist/index.html
          rm -f dist/site-template.html
          cp -a dist/. .
          rm -f app-source.html
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish Chess Coach site"
            git push origin HEAD:main
          fi
